name: Auto Build

run-name: "Auto Build ${{ fromJson(inputs.build_payload).run_id }}"

on:
  workflow_dispatch:
    inputs:
      build_payload:
        description: Versioned Guizhan Resources auto-build payload JSON
        required: true
        type: string
      build_payload_timestamp:
        description: Unix timestamp used for build payload signing
        required: true
        type: string
      build_payload_signature:
        description: HMAC-SHA256 signature for build payload verification
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_repo: ${{ steps.payload.outputs.source_repo }}
      source_commit_sha: ${{ steps.payload.outputs.source_commit_sha }}
      java_version: ${{ steps.payload.outputs.java_version }}
      maven_version: ${{ steps.payload.outputs.maven_version }}
      sdkman_custom: ${{ steps.payload.outputs.sdkman_custom }}
      artifact_retention: ${{ steps.payload.outputs.artifact_retention }}
      manifest_artifact_name: ${{ steps.payload.outputs.manifest_artifact_name }}
      build_artifact_name: ${{ steps.payload.outputs.build_artifact_name }}
    steps:
      - name: Checking out runner repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Setup node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "26.5.1"

      - name: Cache bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install runner dependencies
        run: bun ci

      - name: Compile runner scripts
        run: bunx tsc --outDir dist --declaration false --declarationMap false

      - name: Validate build payload
        id: payload
        run: node dist/src/runner.js validate
        env:
          BUILD_PAYLOAD: ${{ inputs.build_payload }}
          BUILD_PAYLOAD_TIMESTAMP: ${{ inputs.build_payload_timestamp }}
          BUILD_PAYLOAD_SIGNATURE: ${{ inputs.build_payload_signature }}
          AUTO_BUILD_CALLBACK_SECRET: ${{ secrets.AUTO_BUILD_CALLBACK_SECRET }}

  build:
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 30
    steps:
      - name: Checking out runner repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Setup node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "26.5.1"

      - name: Cache bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install runner dependencies
        run: bun ci

      - name: Compile runner scripts
        run: bunx tsc --outDir dist --declaration false --declarationMap false

      - name: Validate build payload
        run: node dist/src/runner.js validate
        env:
          BUILD_PAYLOAD: ${{ inputs.build_payload }}
          BUILD_PAYLOAD_TIMESTAMP: ${{ inputs.build_payload_timestamp }}
          BUILD_PAYLOAD_SIGNATURE: ${{ inputs.build_payload_signature }}
          AUTO_BUILD_CALLBACK_SECRET: ${{ secrets.AUTO_BUILD_CALLBACK_SECRET }}

      - name: Checking out source repository
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.source_repo }}
          ref: ${{ needs.prepare.outputs.source_commit_sha }}
          path: source
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ needs.prepare.outputs.java_version }}

      - name: Setup Maven
        uses: s4u/setup-maven-action@v1.18.0
        with:
          maven-version: ${{ needs.prepare.outputs.maven_version }}
          checkout-enabled: false
          java-version: ${{ needs.prepare.outputs.java_version }}
          java-distribution: temurin

      - name: Run SDKMAN custom setup
        if: needs.prepare.outputs.sdkman_custom != ''
        run: node dist/src/toolchain.js
        env:
          SDKMAN_CUSTOM: ${{ needs.prepare.outputs.sdkman_custom }}

      - name: Run explicit build command
        run: node dist/src/runner.js build payload.json source

      - name: Stage build artifacts
        run: |
          rm -rf artifact-source
          mkdir -p artifact-source
          if [ -d source/target ]; then
            mkdir -p artifact-source/target
            cp -R source/target/. artifact-source/target/
          fi
          if [ -d source/build/libs ]; then
            mkdir -p artifact-source/build/libs
            cp -R source/build/libs/. artifact-source/build/libs/
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.build_artifact_name }}
          path: artifact-source
          if-no-files-found: error
          retention-days: ${{ needs.prepare.outputs.artifact_retention }}

  finalize:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
    if: always() && needs.prepare.result == 'success'
    timeout-minutes: 10
    steps:
      - name: Checking out runner repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Setup node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "26.5.1"

      - name: Cache bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install runner dependencies
        run: bun ci

      - name: Compile runner scripts
        run: bunx tsc --outDir dist --declaration false --declarationMap false

      - name: Validate build payload
        run: node dist/src/runner.js validate
        env:
          BUILD_PAYLOAD: ${{ inputs.build_payload }}
          BUILD_PAYLOAD_TIMESTAMP: ${{ inputs.build_payload_timestamp }}
          BUILD_PAYLOAD_SIGNATURE: ${{ inputs.build_payload_signature }}
          AUTO_BUILD_CALLBACK_SECRET: ${{ secrets.AUTO_BUILD_CALLBACK_SECRET }}

      - name: Download build artifacts
        if: needs.build.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.build_artifact_name }}
          path: artifact-source

      - name: Generate manifest
        if: needs.build.result == 'success'
        run: node dist/src/runner.js manifest payload.json artifact-source .runner-output

      - name: Upload manifest
        if: needs.build.result == 'success' && success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.manifest_artifact_name }}
          path: .runner-output/manifest.json
          if-no-files-found: error
          retention-days: ${{ needs.prepare.outputs.artifact_retention }}

      - name: Invoke callback
        if: always()
        run: node dist/src/runner.js callback payload.json .runner-output
        env:
          AUTO_BUILD_CALLBACK_SECRET: ${{ secrets.AUTO_BUILD_CALLBACK_SECRET }}
          JOB_STATUS: ${{ needs.build.result == 'success' && job.status || needs.build.result }}
